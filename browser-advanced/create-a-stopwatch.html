<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a stopwatch.</title>
    <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Create a stopwatch.</h1>
            <p>JavaScript experiment from the supplied practical list.</p>
        </div>
    </header>

    <main class="container">
        
    <nav>
        <a href="../../index.html">Home</a>
        <a href="index.html">Back to Programs</a>
    </nav>
    
        <section class="card">
            <h2>Working Demonstration</h2>
            
        <div id="time" class="demo-box" style="font-size: 2rem; text-align: center;">00:00:00</div>
        <button id="start">Start</button>
        <button id="stop">Stop</button>
        <button id="reset">Reset</button>
        
        </section>
    </main>

    <footer>
        A. Kumar | CDS/2025/2009 | Section 7
    </footer>
    <script>
        let seconds = 0;
        let timer = null;
        function render() {
            const h = String(Math.floor(seconds / 3600)).padStart(2, "0");
            const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
            const s = String(seconds % 60).padStart(2, "0");
            document.getElementById("time").textContent = `${h}:${m}:${s}`;
        }
        document.getElementById("start").onclick = () => {
            if (!timer) timer = setInterval(() => { seconds++; render(); }, 1000);
        };
        document.getElementById("stop").onclick = () => {
            clearInterval(timer);
            timer = null;
        };
        document.getElementById("reset").onclick = () => {
            clearInterval(timer);
            timer = null;
            seconds = 0;
            render();
        };
        </script>
</body>
</html>
