<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a JavaScript program to swap two numbers.</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Write a JavaScript program to swap two numbers.</h1>
            <p>JavaScript experiment from the supplied practical list.</p>
        </div>
    </header>

    <main class="container">
        
    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to Programs</a>
    </nav>
    
        <section class="card">
            <h2>Working Demonstration</h2>
            <input id="a" type="number" value="10"><input id="b" type="number" value="20"><button id="run">Swap</button><div id="out" class="output"></div>
        </section>
    </main>

    <footer>
        A. Kumar | CDS/2025/2009 | Section 7
    </footer>
    <script>document.getElementById("run").onclick = () => { const a = Number(document.getElementById("a").value); const b = Number(document.getElementById("b").value); [document.getElementById("a").value, document.getElementById("b").value] = [b, a]; document.getElementById("out").textContent = `Swapped: ${b}, ${a}`; };</script>
</body>
</html>
