<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a program to generate the Fibonacci series.</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Write a program to generate the Fibonacci series.</h1>
            <p>JavaScript experiment from the supplied practical list.</p>
        </div>
    </header>

    <main class="container">
        
    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to Programs</a>
    </nav>
    
        <section class="card">
            <h2>Working Demonstration</h2>
            <input id="n" type="number" min="1" value="8"><button id="run">Generate</button><div id="out" class="output"></div>
        </section>
    </main>

    <footer>
        A. Kumar | CDS/2025/2009 | Section 7
    </footer>
    <script>document.getElementById("run").onclick = () => { const n = Number(document.getElementById("n").value); const a = [0, 1]; while (a.length < n) a.push(a.at(-1) + a.at(-2)); document.getElementById("out").textContent = a.slice(0, n).join(", "); };</script>
</body>
</html>
