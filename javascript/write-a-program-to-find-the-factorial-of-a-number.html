<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a program to find the factorial of a number.</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Write a program to find the factorial of a number.</h1>
            <p>JavaScript experiment from the supplied practical list.</p>
        </div>
    </header>

    <main class="container">
        
    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to Programs</a>
    </nav>
    
        <section class="card">
            <h2>Working Demonstration</h2>
            <input id="n" type="number" min="0" value="5"><button id="run">Find Factorial</button><div id="out" class="output"></div>
        </section>
    </main>

    <footer>
        A. Kumar | CDS/2025/2009 | Section 7
    </footer>
    <script>document.getElementById("run").onclick = () => { let n = Number(document.getElementById("n").value); let r = 1; for (let i = 2; i <= n; i++) r *= i; document.getElementById("out").textContent = `Factorial: ${r}`; };</script>
</body>
</html>
