<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a program to find the sum of digits of a number.</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Write a program to find the sum of digits of a number.</h1>
            <p>JavaScript experiment from the supplied practical list.</p>
        </div>
    </header>

    <main class="container">
        
    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Back to Programs</a>
    </nav>
    
        <section class="card">
            <h2>Working Demonstration</h2>
            <input id="n" type="number" value="12345"><button id="run">Sum</button><div id="out" class="output"></div>
        </section>
    </main>

    <footer>
        A. Kumar | CDS/2025/2009 | Section 7
    </footer>
    <script>document.getElementById("run").onclick=()=>{const s=Math.abs(Math.trunc(Number(document.getElementById("n").value))).toString();document.getElementById("out").textContent=`Sum: ${[...s].reduce((a,b)=>a+Number(b),0)}`;};</script>
</body>
</html>
