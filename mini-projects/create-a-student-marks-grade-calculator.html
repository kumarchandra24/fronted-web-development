<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a student marks/grade calculator.</title>
    <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Create a student marks/grade calculator.</h1>
            <p>JavaScript experiment from the supplied practical list.</p>
        </div>
    </header>

    <main class="container">
        
    <nav>
        <a href="../../index.html">Home</a>
        <a href="index.html">Back to Programs</a>
    </nav>
    
        <section class="card">
            <h2>Working Demonstration</h2>
            
        <input id="marks" type="text" placeholder="Marks: 78, 82, 91">
        <button id="calculate">Calculate</button>
        <div id="out" class="output"></div>
        
        </section>
    </main>

    <footer>
        A. Kumar | CDS/2025/2009 | Section 7
    </footer>
    <script>
        document.getElementById("calculate").onclick = () => {
            const marks = document.getElementById("marks").value
                .split(",").map(Number).filter(Number.isFinite);
            const total = marks.reduce((a, b) => a + b, 0);
            const average = marks.length ? total / marks.length : 0;
            const grade = average >= 90 ? "A+" : average >= 80 ? "A" : average >= 70 ? "B" : average >= 60 ? "C" : "D";
            document.getElementById("out").textContent =
                `Total: ${total}, Average: ${average.toFixed(2)}, Grade: ${grade}`;
        };
        </script>
</body>
</html>
