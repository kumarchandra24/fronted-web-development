<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a currency converter using an API.</title>
    <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Create a currency converter using an API.</h1>
            <p>JavaScript experiment from the supplied practical list.</p>
        </div>
    </header>

    <main class="container">
        
    <nav>
        <a href="../../index.html">Home</a>
        <a href="index.html">Back to Programs</a>
    </nav>
    
        <section class="card">
            <h2>Working Demonstration</h2>
            
        <p>This demonstration uses the browser Fetch API with a public JSON endpoint.</p>
        <button id="load">Load Sample API Data</button>
        <pre id="out" class="output"></pre>
        
        </section>
    </main>

    <footer>
        A. Kumar | CDS/2025/2009 | Section 7
    </footer>
    <script>
        document.getElementById("load").onclick = async () => {
            const out = document.getElementById("out");
            out.textContent = "Loading...";
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/todos/1");
                const data = await response.json();
                out.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                out.textContent = `API request failed: ${error.message}`;
            }
        };
        </script>
</body>
</html>
