<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a digital calculator.</title>
    <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Create a digital calculator.</h1>
            <p>JavaScript experiment from the supplied practical list.</p>
        </div>
    </header>

    <main class="container">
        
    <nav>
        <a href="../../index.html">Home</a>
        <a href="index.html">Back to Programs</a>
    </nav>
    
        <section class="card">
            <h2>Working Demonstration</h2>
            
        <input id="a" type="number" placeholder="First number">
        <select id="op">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input id="b" type="number" placeholder="Second number">
        <button id="calc">Calculate</button>
        <div id="out" class="output"></div>
        
        </section>
    </main>

    <footer>
        A. Kumar | CDS/2025/2009 | Section 7
    </footer>
    <script>
        document.getElementById("calc").addEventListener("click", () => {
            const a = Number(document.getElementById("a").value);
            const b = Number(document.getElementById("b").value);
            const op = document.getElementById("op").value;
            let result = 0;
            if (op === "+") result = a + b;
            if (op === "-") result = a - b;
            if (op === "*") result = a * b;
            if (op === "/") result = b === 0 ? "Cannot divide by zero" : a / b;
            document.getElementById("out").textContent = `Result: ${result}`;
        });
        </script>
</body>
</html>
